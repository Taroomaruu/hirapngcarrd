<!DOCTYPE html>
<html>
<head>
  <title>taromaryuu</title>
  <style>
    body {
      background-color: #f7c5cc;
      font-family: 'Nunito', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: #5a3530;
      border-radius: 24px;
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    .card-body {
      display: flex;
      min-height: 420px;
    }

    .card-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 44px 36px 36px 44px;
    }

    h1 {
      color: #e8849a;
      font-size: 3rem;
      font-weight: 900;
      margin: 0;
    }

    .divider {
      color: #e8849a;
      font-size: 1.1rem;
      letter-spacing: 6px;
    }

    .bio {
      color: #f5c8d4;
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background-color: #7d4a44;
      border: 1.5px solid #c47080;
      border-radius: 12px;
      padding: 16px 22px;
      text-decoration: none;
      color: #f5c8d4;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover {
      background-color: #9a5a54;
      border-color: #e8849a;
      transform: translateX(3px);
    }

    .btn-arrow {
      margin-left: auto;
      opacity: 0.7;
    }

    /* Image fills the entire right side */
    .card-right {
      flex: 0 0 380px;
      position: relative;
      overflow: hidden;
    }

    .card-right img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .bottom-bar {
      background-color: #8a4a44;
      border-radius: 60px;
      margin: 0 20px 20px 20px;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .bar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #f5c8d4;
      font-weight: 700;
      font-size: 0.85rem;
      transition: transform 0.1s, color 0.1s;
    }

    .bar-link:hover {
      color: white;
      transform: translateY(-2px);
    }

    .bar-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #5a3530;
      border: 1.5px solid #c47080;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .bar-icon img {
      filter: brightness(0) invert(1) sepia(1) saturate(2) hue-rotate(300deg);
    }

    .bar-text-name {
      display: block;
      color: #e8849a;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .bar-text-handle {
      display: block;
      font-size: 0.78rem;
      opacity: 0.85;
    }

    .bar-divider {
      width: 1px;
      height: 28px;
      background-color: rgba(255,255,255,0.15);
    }

    @media (max-width: 650px) {
      .card-body { flex-direction: column; }
      .card-left { padding: 28px 24px 20px 24px; }
      .card-right { flex: none; height: 280px; }
      .card-right img { border-radius: 0; }
      h1 { font-size: 2.4rem; }
      .bottom-bar { flex-wrap: wrap; border-radius: 16px; gap: 12px; padding: 16px; }
      .bar-divider { display: none; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="card">

  <div class="card-body">
    <div class="card-left">
      <h1>taromaryuu</h1>
      <div class="divider">— ✦ —</div>
      <p class="bio">19 🍓 filipino 🍓 i like drawing men and cute stuff (miku)</p>

      <div class="buttons">
        <a href="portfolio.html" class="btn">
          <span>📁</span>
          <span>Portfolio</span>
          <span class="btn-arrow">▶</span>
        </a>
        <a href="tos.html" class="btn">
          <span>📄</span>
          <span>Terms of Service</span>
          <span class="btn-arrow">▶</span>
        </a>
      </div>
    </div>

    <div class="card-right">
      <img src="assets/Peace_Taron.png" alt="me">
    </div>
  </div>

  <div class="bottom-bar">
    <a href="https://vgen.co/taromaryuu" target="_blank" class="bar-link">
      <div class="bar-icon"><img src="assets/vgenlogo.png" width="20"></div>
      <div>
        <span class="bar-text-name">VGen</span>
        <span class="bar-text-handle">@taromaryuu</span>
      </div>
    </a>

    <div class="bar-divider"></div>

    <a href="https://twitter.com/taromaryuu" target="_blank" class="bar-link">
      <div class="bar-icon"><img src="assets/X-Logo.png" width="20"></div>
      <div>
        <span class="bar-text-name">Twitter / X</span>
        <span class="bar-text-handle">@taromaryuu</span>
      </div>
    </a>

    <div class="bar-divider"></div>

    <a href="https://tiktok.com/@taromaryuu" target="_blank" class="bar-link">
      <div class="bar-icon"><img src="assets/tiktok_PNG22.png" width="20"></div>
      <div>
        <span class="bar-text-name">TikTok</span>
        <span class="bar-text-handle">@taromaryuu</span>
      </div>
    </a>

    <div class="bar-divider"></div>

    <a href="https://ko-fi.com/taromaryuu" target="_blank" class="bar-link">
      <div class="bar-icon"><img src="assets/ko-fi.png" width="20"></div>
      <div>
        <span class="bar-text-name">Ko-fi</span>
        <span class="bar-text-handle">@taromaryuu</span>
      </div>
    </a>
  </div>

</div>

</body>
</html>
